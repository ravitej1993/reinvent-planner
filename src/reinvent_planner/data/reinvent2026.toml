# Off-peak monorail tip for "a|b": board at `from` (near a), leave at `to` (near b).
[monorail]
"venetian|caesars_palace" = { from = "Harrah's/The LINQ", to = "Flamingo/Caesars Palace", minutes = 42, walking = 35, ride = 2 }
"venetian|mgm" = { from = "Harrah's/The LINQ", to = "MGM Grand", minutes = 35, walking = 24, ride = 6 }
"wynn|mgm" = { from = "Harrah's/The LINQ", to = "MGM Grand", minutes = 44, walking = 33, ride = 6 }
"encore|mgm" = { from = "Harrah's/The LINQ", to = "MGM Grand", minutes = 46, walking = 35, ride = 6 }
"caesars_forum|caesars_palace" = { from = "Harrah's/The LINQ", to = "Flamingo/Caesars Palace", minutes = 31, walking = 24, ride = 2 }
"caesars_forum|mgm" = { from = "Harrah's/The LINQ", to = "MGM Grand", minutes = 24, walking = 13, ride = 6 }
"caesars_palace|mgm" = { from = "Flamingo/Caesars Palace", to = "MGM Grand", minutes = 39, walking = 29, ride = 5 }
